apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: apiserver
      - job_name: 'flask-microservices'
        static_configs:
        - targets: 
          - 'auth-service:5001'
          - 'product-service:5002'
          - 'cart-service:5003'
          - 'order-service:5004'
          - 'payment-service:5005'
          - 'notification-service:5006'
          - 'api-gateway:5000'
