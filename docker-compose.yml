
networks:
  ecommerce-net:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15-alpine
    container_name: ec-postgres
    networks: [ecommerce-net]
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ec-redis
    networks: [ecommerce-net]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ec-zookeeper
    networks: [ecommerce-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ec-kafka
    networks: [ecommerce-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  auth-service:
    build: ./services/auth
    container_name: ec-auth-service
    networks: [ecommerce-net]
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      JWT_SECRET: super-secret-key-998877
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-service:
    build: ./services/product
    container_name: ec-product-service
    networks: [ecommerce-net]
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cart-service:
    build: ./services/cart
    container_name: ec-cart-service
    networks: [ecommerce-net]
    ports:
      - "5003:5003"
    environment:
      PORT: "5003"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    build: ./services/order
    container_name: ec-order-service
    networks: [ecommerce-net]
    ports:
      - "5004:5004"
    environment:
      PORT: "5004"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  payment-service:
    build: ./services/payment
    container_name: ec-payment-service
    networks: [ecommerce-net]
    ports:
      - "5005:5005"
    environment:
      PORT: "5005"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-service:
    build: ./services/notification
    container_name: ec-notification-service
    networks: [ecommerce-net]
    ports:
      - "5006:5006"
    environment:
      PORT: "5006"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build: ./api-gateway
    container_name: ec-api-gateway
    networks: [ecommerce-net]
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      JWT_SECRET: super-secret-key-998877
      RATE_LIMIT_PER_MINUTE: "120"
      AUTH_SERVICE_URL: http://auth-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
      CART_SERVICE_URL: http://cart-service:5003
      ORDER_SERVICE_URL: http://order-service:5004
      PAYMENT_SERVICE_URL: http://payment-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5006
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build: ./frontend
    container_name: ec-frontend
    networks: [ecommerce-net]
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
